<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="recallGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34E7A8"/>
      <stop offset="100%" stop-color="#FFB454"/>
    </linearGradient>
    <linearGradient id="recallGradDim" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34E7A8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFB454" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" fill="#0F1115"/>
  <rect width="512" height="512" rx="112" fill="url(#recallGradDim)"/>
  <rect x="4" y="4" width="504" height="504" rx="108" stroke="url(#recallGrad)" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Brain/memory abstraction: two overlapping circles representing recall + retention -->
  <circle cx="196" cy="256" r="88" stroke="url(#recallGrad)" stroke-width="16" fill="none"/>
  <circle cx="316" cy="256" r="88" stroke="url(#recallGrad)" stroke-width="16" fill="none" stroke-opacity="0.65"/>

  <!-- Central memory pulse — the "spark" of recall -->
  <circle cx="256" cy="256" r="32" fill="url(#recallGrad)">
    <animate attributeName="r" values="28;36;28" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.85;1;0.85" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Inner highlight -->
  <circle cx="256" cy="256" r="14" fill="#0F1115" fill-opacity="0.4"/>

  <!-- Subtle particle dots around the intersection -->
  <circle cx="256" cy="168" r="4" fill="url(#recallGrad)" opacity="0.5">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="256" cy="344" r="4" fill="url(#recallGrad)" opacity="0.5">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="168" cy="256" r="3" fill="url(#recallGrad)" opacity="0.4">
    <animate attributeName="opacity" values="0.3;0.5;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="344" cy="256" r="3" fill="url(#recallGrad)" opacity="0.4">
    <animate attributeName="opacity" values="0.5;0.3;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
